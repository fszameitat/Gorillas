<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Two gorillas trade electric bananas across a neon skyline. Play the CPU or a friend online.">
<title>Gorillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500;600;700&family=Rajdhani:wght@500;700&display=swap">
<style>
/* Layout: one 16:9 arena. Fighting-game HUD pinned inside it: health bars + clock on top, throw meter + wind at the bottom, announcer text centre stage */
:root{
  --night:#05041a; --ink:#f4f1ff; --muted:#a49cc9; --gold:#ffc83d; --ember:#ff5a1f; --volt:#6ff3ff;
  --p1:#ff3355; --p2:#3fa9ff; --panel:rgba(8,6,26,.72); --edge:rgba(255,255,255,.14);
  --shout:"Anton",Impact,"Arial Narrow Bold",sans-serif; --hud:"Teko","Arial Narrow",sans-serif; --ui:"Rajdhani",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--ink)}
body{margin:0;min-height:100vh;box-sizing:border-box;align-items:center}
body{font-family:var(--ui);font-size:17px;padding-block:16px;padding-inline:16px;display:flex;justify-content:center}
.stage{position:relative;width:100%;max-width:1200px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none;container-type:inline-size;box-shadow:0 20px 60px -20px rgba(120,40,200,.5)}
canvas#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:2.2cqw 2.4cqw}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:1.6cqw;align-items:start}
.side{display:flex;flex-direction:column;gap:.4cqw;min-width:0}
.side.right{align-items:flex-end}
.nm{font-family:var(--hud);font-weight:700;font-size:3.1cqw;line-height:.8;letter-spacing:.06em;font-style:italic;text-shadow:0 2px 0 #000,0 0 14px rgba(0,0,0,.6)}
.left .nm{color:#ffd5dc}.right .nm{color:#d5ecff}
.side.turn .nm{color:var(--gold);text-shadow:0 2px 0 #000,0 0 18px rgba(255,200,61,.7)}
.tag{font-family:var(--hud);font-size:1.5cqw;letter-spacing:.2em;color:var(--muted);line-height:1}
.bar{position:relative;width:100%;height:2.2cqw;background:linear-gradient(#1b1030,#0b0718);border:.25cqw solid #f1e6c8;box-shadow:0 0 0 .2cqw #000,0 .4cqw 1cqw rgba(0,0,0,.6);overflow:hidden}
.left .bar{transform:skewX(-20deg)}.right .bar{transform:skewX(20deg)}
.bar i{position:absolute;top:0;bottom:0;width:100%}
.bar .trail{background:#e11d48;transition:width .6s ease .45s}
.bar .fill{background:linear-gradient(#fff7b0,#ffd23f 45%,#ff9f1c);transition:width .18s}
.left .bar i{left:0}.right .bar i{right:0}
.bar .segs{background:repeating-linear-gradient(90deg,transparent 0 calc(100%/var(--n) - .3cqw),rgba(0,0,0,.75) calc(100%/var(--n) - .3cqw) calc(100%/var(--n)))}
.bar.low .fill{background:linear-gradient(#ffd0d0,#ff4d4d 50%,#b3001b);animation:pulse .7s infinite alternate}
@keyframes pulse{to{filter:brightness(1.4)}}
.clock{display:flex;flex-direction:column;align-items:center;gap:.2cqw;min-width:7cqw}
.clock b{font-family:var(--shout);font-weight:400;font-size:5.2cqw;line-height:.9;color:#fff;text-shadow:0 .3cqw 0 #000,0 0 1.4cqw rgba(111,243,255,.55);font-variant-numeric:tabular-nums}
.clock b.warn{color:#ff6b6b}
.clock span{font-family:var(--hud);font-size:1.6cqw;letter-spacing:.24em;color:var(--muted)}
.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:1.6cqw}
.meter{display:flex;flex-direction:column;gap:.3cqw;min-width:0;max-width:26cqw}
.meter.right{justify-self:end;align-items:flex-end;grid-column:3}
.meter.left{grid-column:1}
.mrow{display:flex;gap:1cqw;align-items:baseline;font-family:var(--hud);font-size:1.8cqw;letter-spacing:.14em;color:var(--muted);line-height:1}
.mrow b{font-family:var(--shout);font-weight:400;font-size:2.6cqw;color:var(--ink);letter-spacing:.02em}
.pbar{width:24cqw;height:1.2cqw;background:#0b0718;border:.2cqw solid #f1e6c8;transform:skewX(-20deg);overflow:hidden;position:relative}
.meter.right .pbar{transform:skewX(20deg)}
.pbar i{position:absolute;inset:0;width:50%;background:linear-gradient(90deg,#3fa9ff,#6ff3ff 60%,#ffffff)}
.meter.right .pbar i{left:auto;right:0;background:linear-gradient(270deg,#3fa9ff,#6ff3ff 60%,#ffffff)}
.wind{grid-column:2;display:flex;align-items:center;gap:.8cqw;background:var(--panel);border:1px solid var(--edge);padding:.4cqw 1.4cqw;font-family:var(--hud);font-size:1.8cqw;letter-spacing:.2em;color:var(--muted);line-height:1;transform:skewX(-12deg)}
.wind #wa{color:var(--volt);letter-spacing:-.05em;font-size:2.4cqw;min-width:5cqw;text-align:center;animation:drift 1s linear infinite}
.wind b{font-family:var(--shout);font-weight:400;color:var(--ink);letter-spacing:.02em;font-size:2.2cqw}
@keyframes drift{50%{opacity:.45}}
.announce{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;gap:.5cqw}
.announce span{font-family:var(--shout);font-size:11cqw;line-height:1;letter-spacing:.02em;opacity:0;
  background:linear-gradient(#fffbe0 0%,#ffe066 35%,#ff9500 62%,#ff3d00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:.25cqw #1a0500;filter:drop-shadow(0 .5cqw 0 rgba(0,0,0,.85)) drop-shadow(0 0 2.4cqw rgba(255,120,0,.55))}
.announce small{font-family:var(--hud);font-size:2.6cqw;letter-spacing:.3em;color:var(--volt);opacity:0;text-shadow:0 2px 0 #000}
.announce.cool span{background-image:linear-gradient(#ffffff 0%,#b9fbff 40%,#3fd6ff 70%,#1a5cff 100%);filter:drop-shadow(0 .5cqw 0 rgba(0,0,0,.85)) drop-shadow(0 0 2.4cqw rgba(80,200,255,.6))}
.announce.show span,.announce.show small{animation:slam var(--d,1s) cubic-bezier(.2,.9,.25,1) forwards}
.announce.hold span,.announce.hold small{animation:slamHold .5s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes slam{0%{opacity:0;transform:skewX(-10deg) scale(2.4)}14%{opacity:1;transform:skewX(-10deg) scale(1)}78%{opacity:1;transform:skewX(-10deg) scale(1.05)}100%{opacity:0;transform:skewX(-10deg) scaleX(1.7) scaleY(.15)}}
@keyframes slamHold{0%{opacity:0;transform:skewX(-10deg) scale(2.4)}100%{opacity:1;transform:skewX(-10deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.announce.show span,.announce.show small,.announce.hold span,.announce.hold small{animation:fade var(--d,1s) forwards}@keyframes fade{10%,80%{opacity:1}}.announce.hold span,.announce.hold small{animation:none;opacity:1}}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;padding:2cqw;text-align:center;overflow:auto;
  background:radial-gradient(ellipse at center,rgba(20,10,50,.55),rgba(3,2,14,.92))}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1cqw;width:100%;max-width:88cqw}
.card{position:relative;height:30cqw;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;overflow:hidden}
.card.p1{clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);background:linear-gradient(115deg,#5c0a1f,#ff3355 55%,#ff9a3d)}
.card.p2{clip-path:polygon(0 0,92% 0,100% 100%,8% 100%);background:linear-gradient(245deg,#062a5c,#3fa9ff 55%,#6ff3ff)}
.card::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.08) 0 .3cqw,transparent .3cqw 2.4cqw);mix-blend-mode:overlay}
.card canvas{position:absolute;inset:0;width:100%;height:100%}
.cn{position:relative;font-family:var(--shout);font-size:4.4cqw;line-height:1;color:#fff;text-shadow:0 .3cqw 0 #000;padding-bottom:.4cqw;font-style:italic}
.ct{position:relative;font-family:var(--hud);font-size:1.8cqw;letter-spacing:.3em;color:rgba(255,255,255,.85);padding-bottom:1.2cqw}
.vsm{font-family:var(--shout);font-size:9cqw;font-style:italic;background:linear-gradient(#fff,#ffd23f 50%,#ff5a1f);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.2cqw #1a0500;filter:drop-shadow(0 .4cqw 0 #000)}
.opts{display:flex;gap:2.4cqw;flex-wrap:wrap;justify-content:center}
.opt{display:flex;gap:.6cqw;align-items:center}
.opt span{font-family:var(--hud);font-size:2cqw;letter-spacing:.24em;color:var(--muted);margin-right:.4cqw}
button{font-family:var(--hud);font-weight:600;font-size:max(13px,2cqw);letter-spacing:.14em;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--edge);padding:.5cqw 1.4cqw;cursor:pointer;transform:skewX(-12deg)}
button[aria-pressed="true"]{background:var(--ink);color:#120a24;border-color:var(--ink)}
button.go{font-family:var(--shout);font-weight:400;font-size:max(18px,3.4cqw);letter-spacing:.08em;padding:.6cqw 4cqw;background:linear-gradient(#ffe066,#ff9500 60%,#ff3d00);color:#1a0500;border:0;box-shadow:0 .4cqw 0 #6a1500,0 0 3cqw rgba(255,120,0,.45)}
button.go:hover{filter:brightness(1.1)}
button:focus-visible{outline:2px solid var(--volt);outline-offset:3px}
.help{font-size:max(12px,1.7cqw);color:var(--muted);line-height:1.35}
.help b{color:var(--ink);font-weight:700}
#overTitle{font-family:var(--shout);font-size:9cqw;line-height:1;background:linear-gradient(#fffbe0,#ffe066 35%,#ff9500 62%,#ff3d00);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.2cqw #1a0500;filter:drop-shadow(0 .4cqw 0 #000);font-style:italic}
#overText{margin:0;color:var(--muted);max-width:52ch;font-size:max(13px,2cqw)}
.btns{display:flex;gap:1.6cqw;align-items:center}
.onbox{display:flex;flex-direction:column;gap:1.2cqw;align-items:center;width:100%;max-width:64cqw}
.otitle{font-family:var(--shout);font-weight:400;font-size:6cqw;margin:0;font-style:italic;color:var(--volt);text-shadow:0 .3cqw 0 #000}
.field{display:flex;flex-direction:column;gap:.3cqw;align-items:center}
.field span,.or{font-family:var(--hud);font-size:max(12px,1.8cqw);letter-spacing:.24em;color:var(--muted)}
input{font-family:var(--hud);font-weight:600;font-size:max(16px,2.6cqw);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--edge);padding:.3cqw 1.2cqw;width:14ch;text-align:center}
input::placeholder{color:rgba(164,156,201,.6)}
input:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
#code{width:7ch}
#invite{width:30ch;max-width:60vw;text-transform:none;letter-spacing:0;font-size:max(13px,1.7cqw)}
.onrow{display:flex;gap:1cqw;align-items:center;flex-wrap:wrap;justify-content:center}
.lobby{display:flex;flex-direction:column;gap:.6cqw;align-items:center}
.lobby .empty{font-size:max(12px,1.7cqw);color:var(--muted)}
.lob{background:rgba(111,243,255,.12);border-color:var(--volt)}
.big{font-family:var(--shout);font-size:9cqw;letter-spacing:.2em;margin:0;color:var(--gold);text-shadow:0 .4cqw 0 #000}
#waitText,.onmsg{margin:0;color:var(--muted);max-width:46ch;font-size:max(13px,1.9cqw)}
.onmsg{color:#ffb3b3}
.onmsg:empty{display:none}
#mute{position:absolute;right:1.4cqw;bottom:1.4cqw;z-index:3;font-size:max(11px,1.5cqw);padding:.3cqw .9cqw}
</style>

</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud" hidden>
    <div class="top">
      <div class="side left" id="s0"><span class="nm" id="n0">BRUTUS</span><div class="bar" id="b0"><i class="trail" id="t0"></i><i class="fill" id="f0"></i><i class="segs"></i></div><span class="tag" id="g0">YOU</span></div>
      <div class="clock"><b id="clock">20</b><span id="round">ROUND 1</span></div>
      <div class="side right" id="s1"><span class="nm" id="n1">TITAN</span><div class="bar" id="b1"><i class="trail" id="t1"></i><i class="fill" id="f1"></i><i class="segs"></i></div><span class="tag" id="g1">CPU</span></div>
    </div>
    <div class="bottom">
      <div class="meter left" id="meter">
        <div class="mrow">ANGLE <b id="mAng">45°</b> POWER <b id="mPow">60</b></div>
        <div class="pbar"><i id="mBar"></i></div>
      </div>
      <div class="wind"><span>WIND</span><span id="wa">·</span><b id="wv">0</b></div>
    </div>
  </div>
  <div class="announce" id="ann"></div>
  <button id="mute" aria-pressed="false">♪ ON</button>

  <div class="overlay" id="menu">
    <div class="vs">
      <div class="card p1"><canvas id="port0" width="420" height="340"></canvas><span class="cn">BRUTUS</span><span class="ct">YOU</span></div>
      <span class="vsm">VS</span>
      <div class="card p2"><canvas id="port1" width="420" height="340"></canvas><span class="cn">TITAN</span><span class="ct" id="ct1">CPU</span></div>
    </div>
    <div class="opts">
      <div class="opt" id="optMode"><span>MODE</span><button id="mC" data-v="cpu" aria-pressed="true">VS CPU</button><button id="mO" data-v="online" aria-pressed="false">ONLINE</button></div>
      <div class="opt" id="optLives"><span>LIVES</span><button id="l3" data-v="3" aria-pressed="true">3</button><button id="l5" data-v="5" aria-pressed="false">5</button><button id="l7" data-v="7" aria-pressed="false">7</button></div>
      <div class="opt" id="optDiff"><span>CPU</span><button id="dE" data-v="easy" aria-pressed="false">EASY</button><button id="dN" data-v="normal" aria-pressed="true">NORMAL</button><button id="dH" data-v="hard" aria-pressed="false">HARD</button></div>
    </div>
    <button class="go" id="start">FIGHT</button>
    <div class="help"><b>Drag back and release</b> to throw, like a slingshot. Keys: <b>↑↓</b> angle · <b>←→</b> power · <b>Space</b> throw · <b>M</b> music</div>
  </div>

  <div class="overlay" id="online" hidden>
    <h3 class="otitle">ONLINE</h3>
    <div class="onbox" id="onMain">
      <label class="field" for="nick"><span>YOUR NAME</span><input id="nick" maxlength="12" autocomplete="off" spellcheck="false" placeholder="PLAYER"></label>
      <button class="go" id="hostBtn">HOST A MATCH</button>
      <span class="or">OR JOIN WITH A CODE</span>
      <div class="onrow"><input id="code" maxlength="4" autocomplete="off" spellcheck="false" placeholder="CODE"><button id="joinBtn">JOIN</button></div>
      
    </div>
    <div class="onbox" id="onWait" hidden><span class="or">MATCH CODE</span><p class="big" id="waitCode"></p><p id="waitText"></p>
      <div class="onrow" id="inviteRow" hidden><input id="invite" readonly aria-label="Invite link"><button id="copyBtn">COPY LINK</button></div></div>
    <p class="onmsg" id="onMsg"></p>
    <button id="onBack">BACK</button>
  </div>

  <div class="overlay" id="over" hidden>
    <div id="overTitle">BRUTUS WINS</div>
    <p id="overText"></p>
    <div class="btns"><button class="go" id="again">REMATCH</button><button id="toMenu">MENU</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>if(typeof Peer!=="function")document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
<script>
const GS=1.2,W=1920,H=1080,Y=H/720,SC=W/480,G=160*SC,K=3.2*SC;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const skyc=mk(W,H),sky=skyc.getContext('2d'),farc=mk(W,H),far=farc.getContext('2d');
const cityc=mk(W,H),cg=cityc.getContext('2d',{willReadFrequently:true});
const cloudc=mk(W,Math.round(360*Y)),vign=mk(W,H);
let rng=Math.random;
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rand=(a,b)=>a+rng()*(b-a),ri=(a,b)=>Math.floor(rand(a,b+1)),pickOne=a=>a[ri(0,a.length-1)];
const randn=()=>{let u=0,v=0;while(!u)u=rng();while(!v)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ================= fighters ================= */
const SKIN=[
  {fur:'#3a2e44',furHi:'#6a5680',furLo:'#140f1c',face:'#7a6270',wrap:'#efe8da',band:'#ff3355'},
  {fur:'#6b7282',furHi:'#c3cbdb',furLo:'#2a2e3c',face:'#3c3544',wrap:'#efe8da',band:'#3fa9ff'}];
const OUT='#07060d';
function blob(c,p){c.beginPath();const n=p.length;c.moveTo((p[n-1][0]+p[0][0])/2,(p[n-1][1]+p[0][1])/2);
  for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}c.closePath()}
function drawGorilla(c,x,y,f,pose,t,sk,mode,wind,gs=1){
  const E=mode==='electric',X=mode==='xray',br=Math.sin(t*2.4)*1.8;
  c.save();c.translate(x,y);c.scale(f*gs,gs);
  if(!E&&!X){c.fillStyle='rgba(0,0,0,.5)';c.beginPath();c.ellipse(0,1,52,8,0,0,7);c.fill()}
  c.lineJoin='round';c.lineCap='round';c.lineWidth=3.2;c.strokeStyle=E?'#ffffff':X?'#6ff3ff':OUT;
  if(E){c.shadowColor='#6ff3ff';c.shadowBlur=26}
  let FUR;
  if(E){FUR=c.createLinearGradient(-55,0,55,0);FUR.addColorStop(0,'#1e8fb3');FUR.addColorStop(.5,'#7df9ff');FUR.addColorStop(1,'#f0ffff')}
  else if(X)FUR='rgba(6,16,32,.88)';
  else{FUR=c.createLinearGradient(-55,0,58,0);FUR.addColorStop(0,sk.furLo);FUR.addColorStop(.55,sk.fur);FUR.addColorStop(1,sk.furHi)}
  const FACE=E?'#effffe':X?'rgba(6,16,32,.88)':sk.face,WRAP=E?'#ffffff':X?'rgba(6,16,32,.88)':sk.wrap,BAND=E?'#ffffff':X?'rgba(111,243,255,.35)':sk.band;
  const P=(pts,fill)=>{blob(c,pts);c.fillStyle=fill;c.fill();c.stroke()};
  const fist=(fx,fy)=>{c.beginPath();c.arc(fx,fy,12,0,7);c.fillStyle=WRAP;c.fill();c.stroke();
    if(!X){c.save();c.shadowBlur=0;c.strokeStyle=BAND;c.lineWidth=3.5;c.beginPath();c.arc(fx,fy,7.5,.25*Math.PI,.8*Math.PI);c.stroke();c.restore()}};
  const upF=pose==='throw'||pose==='victory',upB=pose==='victory';
  c.save();c.translate(0,br*.5);
  if(upB){P([[-18,-96],[-38,-102],[-52,-132],[-56,-158],[-40,-166],[-28,-136],[-20,-112]],FUR);fist(-47,-162)}
  else{P([[-36,-98],[-18,-92],[-24,-52],[-30,-10],[-48,-4],[-52,-32],[-46,-72]],FUR);fist(-41,-9)}
  c.restore();
  P([[-24,-48],[-6,-48],[-6,-22],[-10,0],[-34,0],[-32,-20]],FUR);
  P([[2,-48],[22,-48],[26,-20],[30,0],[6,0],[6,-22]],FUR);
  c.save();c.translate(0,br);
  P([[-32,-100],[0,-110],[30,-100],[38,-70],[28,-40],[-26,-40],[-38,-70]],FUR);
  P([[-10,-92],[22,-90],[26,-66],[6,-54],[-12,-62]],FACE);
  c.save();c.shadowBlur=0;c.lineWidth=1.6;c.strokeStyle='rgba(0,0,0,.35)';c.beginPath();c.moveTo(8,-88);c.lineTo(8,-62);c.stroke();c.restore();
  P([[-8,-132],[14,-138],[34,-128],[38,-106],[24,-94],[0,-94],[-12,-112]],FUR);
  P([[10,-122],[31,-120],[38,-107],[27,-96],[10,-101]],FACE);
  // headband and its tails, blown by the wind

  while(nextT<AC.currentTime+.15){const t=nextT,s=step%64,bar=s>>4,b=s%16;
    if(b%2===0)tone('triangle',mtof(ROOT[bar]+(b%4?12:0)),t,st*1.8,.28,mus);
    const n=LEAD[s];if(n!=null)tone('square',mtof(n+(loop%2?12:0)),t,st*(loop%2?1.4:1.9),loop%2?.045:.06,mus);
    if(loop%2===1)tone('square',mtof(CH[bar][b%3]+12),t,st*.8,.018,mus);

    players=[0,1].map(i=>mkPlayer(i,i===net.seat?'human':'remote',i===net.seat?nickOf():(net.oppNick||'RIVAL')))}

function planShot(p){
  const tgt=players[1-p.i],tx=tgt.x,ty=tgt.y-70*GS;let best={d:1e9,a:45,pw:60};
  for(let a=15;a<=82;a+=1.5)for(let pw=25;pw<=100;pw+=1.5){
    let{x,y,vx,vy}=launch(p,a,pw),d=1e9;const dt=1/60;

  return{a:clamp(best.a+randn()*err,5,88),pw:clamp(best.pw+randn()*err*1.3,10,100),a0:p.angle,p0:p.power}}

function explode(x,y,big){

function hit(p,direct){state='zap';victim=p;timer=0;p.lives--;shake=24;flash=1;hitStop=.14;ts=.35;sfxHit();sfxZap();hud();
  if(p.lives<=0)announce('K.O.','',1800);else announce(direct?'DIRECT HIT':'ZAPPED','cool',1300)}

function update(dt){

function drawBanana(c,x,y,rot,s){c.save();c.translate(x,y);c.rotate(rot);c.scale(s,s);

  c.beginPath();c.arc(0,6,15,Math.PI*1.12,Math.PI*1.88);c.arc(0,13,12,Math.PI*1.82,Math.PI*1.18,true);c.closePath();
  const bg=c.createLinearGradient(0,-10,0,4);bg.addColorStop(0,'#fff39a');bg.addColorStop(1,'#f2b705');c.fillStyle=bg;c.fill();
  c.shadowBlur=0;c.lineWidth=2;c.strokeStyle='#3a2600';c.stroke();
  c.fillStyle='#3a2600';c.beginPath();c.arc(-13,-1,2.2,0,7);c.arc(13,-1,2.2,0,7);c.fill();c.restore()}
function path(c,pts){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(const q of pts)c.lineTo(q[0],q[1]);c.stroke()}

function hud(){
  if(!players.length)return;
  const live=state==='aim'||state==='cpu'||state==='remote';
  players.forEach((p,i)=>{const pct=Math.max(0,p.lives)/opts.lives*100;$('f'+i).style.width=pct+'%';$('t'+i).style.width=pct+'%';
    $('n'+i).textContent=p.name;
    $('b'+i).classList.toggle('low',p.lives===1);$('s'+i).classList.toggle('turn',i===cur&&(live||state==='flight'));
    $('g'+i).textContent=i===cur&&live?({human:'YOUR THROW',cpu:'THINKING…',remote:'AIMING…'})[p.type]:({human:'YOU',cpu:'CPU',remote:'RIVAL'})[p.type]});
  const p=players[cur],m=$('meter');m.className='meter '+(cur?'right':'left');
  m.style.visibility=(live||state==='flight')?'visible':'hidden';
  $('mAng').textContent=Math.round(p.angle)+'°';$('mPow').textContent=Math.round(p.power);$('mBar').style.width=p.power+'%';
  const cl=$('clock');cl.textContent=live?Math.ceil(Math.max(0,clock)):'—';cl.classList.toggle('warn',state==='aim'&&clock<6);
  $('round').textContent='ROUND '+round;
  const n=Math.ceil(Math.abs(wind)/12);$('wa').textContent=wind===0?'·':(wind>0?'›':'‹').repeat(n);$('wv').textContent=Math.abs(wind);
  if(opts.mode==='online'&&state==='aim'&&net.match)net.aim(p)}

/* ================= input ================= */
function toWorld(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{if(state!=='aim')return;audio();cv.setPointerCapture(e.pointerId);drag={s:toWorld(e),moved:false}});
cv.addEventListener('pointermove',e=>{if(!drag||state!=='aim')return;const c=toWorld(e),vx=drag.s.x-c.x,vy=drag.s.y-c.y,len=Math.hypot(vx,vy);drag.c=c;
  if(len<8)return;drag.moved=true;const p=players[cur];p.angle=clamp(Math.atan2(-vy,vx*p.dir)*180/Math.PI,0,180);p.power=clamp(len*1.5/SC,5,100);hud()});
cv.addEventListener('pointerup',()=>{if(drag&&drag.moved&&state==='aim')throwIt();drag=null});
cv.addEventListener('pointercancel',()=>drag=null);
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.key==='m'||e.key==='M'){audio();setMute(!muted);return}
  if(state!=='aim')return;const p=players[cur],st=e.shiftKey?5:1;let used=true;
  if(e.key==='ArrowUp')p.angle=clamp(p.angle+st,0,180);else if(e.key==='ArrowDown')p.angle=clamp(p.angle-st,0,180);
  else if(e.key==='ArrowRight')p.power=clamp(p.power+st,1,100);else if(e.key==='ArrowLeft')p.power=clamp(p.power-st,1,100);
  else if(e.key===' '||e.key==='Enter'){audio();throwIt()}else used=false;
  if(used){e.preventDefault();hud()}});
function pick(groupId,key,parse,after){$(groupId).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;opts[key]=parse(b.dataset.v);
  $(groupId).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));after&&after()})}
opts.pick='cpu';
function menuMode(){const on=opts.pick==='online';$('ct1').textContent=on?'FRIEND ONLINE':'CPU';$('start').textContent=on?'GO ONLINE':'FIGHT';$('optDiff').style.display=on?'none':''}
pick('optMode','pick',String,menuMode);pick('optLives','lives',Number);pick('optDiff','diff',String);
try{$('nick').value=localStorage.getItem('gorillas-nick')||''}catch(e){}
const saveNick=()=>{try{localStorage.setItem('gorillas-nick',nickOf())}catch(e){}};
function openOnline(){$('inviteRow').hidden=true;$('menu').hidden=true;$('online').hidden=false;$('onMain').hidden=false;$('onWait').hidden=true;onMsg('');net.lobby().then(r=>{if(!r)noRoom()})}
$('start').onclick=()=>{audio();if(opts.pick==='online')openOnline();else{opts.mode='cpu';newGame()}};
$('hostBtn').onclick=()=>{audio();saveNick();net.host()};
$('joinBtn').onclick=()=>{audio();saveNick();net.join($('code').value)};
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('joinBtn').click()});
$('copyBtn').onclick=()=>{const v=$('invite').value;const ok=()=>{$('copyBtn').textContent='COPIED';setTimeout(()=>$('copyBtn').textContent='COPY LINK',1500)};
  if(navigator.clipboard)navigator.clipboard.writeText(v).then(ok,()=>{$('invite').select()});else $('invite').select()};
{const hj=location.hash.match(/^#join-([a-z0-9]{4})$/i);if(hj){opts.pick='online';$('optMode').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v==='online'));menuMode();
  openOnline();$('code').value=hj[1].toUpperCase();$('nick').focus()}}
$('onBack').onclick=()=>{net.leave();$('online').hidden=true;$('menu').hidden=false;state='menu'};
$('again').onclick=()=>{audio();if(opts.mode==='online'){net.rematch();$('again').disabled=true;$('again').textContent='WAITING…';$('overText').textContent=`Waiting for ${net.oppNick||'your rival'} to press REMATCH too.`}else newGame()};
$('toMenu').onclick=()=>{if(net.game)net.leave();opts.mode='cpu';$('over').hidden=true;$('hud').hidden=true;$('menu').hidden=false;state='menu'};

/* portraits on the versus screen */
const ports=[$('port0').getContext('2d'),$('port1').getContext('2d')];
function drawPorts(){ports.forEach((c,i)=>{c.clearRect(0,0,420,340);c.save();c.translate(210,330);c.scale(1.85,1.85);
  drawGorilla(c,i?-8:8,0,i?-1:1,i?'idle':'throw',T+i,SKIN[i],'normal',i?-20:20);c.restore()})}

genSky();genCity();
let last=performance.now();
function frame(now){const rdt=Math.min(.05,(now-last)/1000);last=now;let dt=rdt;
  if(hitStop>0){hitStop-=rdt;dt=0}else{dt=rdt*ts;ts=Math.min(1,ts+rdt*.9)}
  update(dt);draw();if(!$('menu').hidden)drawPorts();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
